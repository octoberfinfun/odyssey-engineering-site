name: Shopify Playwright QA

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: "Number of test browser sessions (1-100)"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  storefront-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p .qa-playwright/qa-results
          cd .qa-playwright
          printf '%s\n' '{"name":"odyssey-qa-playwright","private":true}' > package.json
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run storefront browser sessions
        shell: bash
        env:
          REQUESTED_SESSIONS: ${{ inputs.sessions }}
          STORE_URL: "https://shop.odysseyengineeringgrp.com/"
        run: |
          cd .qa-playwright
          mkdir -p qa-results

          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const storeUrl = process.env.STORE_URL;
          const requested = Number.parseInt(process.env.REQUESTED_SESSIONS || '5', 10);
          const sessions = Number.isFinite(requested) ? Math.min(100, Math.max(1, requested)) : 5;

          const viewports = [
            { width: 1440, height: 900 },
            { width: 1366, height: 768 },
            { width: 1280, height: 800 },
            { width: 1024, height: 768 },
            { width: 390, height: 844 },
          ];

          const report = {
            storeUrl,
            requestedSessions: process.env.REQUESTED_SESSIONS,
            executedSessions: sessions,
            startedAt: new Date().toISOString(),
            sessions: [],
          };

          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          async function safeGoto(page, url, sessionLog, label) {
            const started = Date.now();
            try {
              const response = await page.goto(url, {
                waitUntil: 'domcontentloaded',
                timeout: 30000,
              });
              await page.waitForTimeout(1200);
              sessionLog.visits.push({
                label,
                url: page.url(),
                title: await page.title(),
                status: response ? response.status() : null,
                ms: Date.now() - started,
              });
              return true;
            } catch (error) {
              sessionLog.errors.push({
                type: 'navigation',
                label,
                url,
                message: String(error.message || error),
              });
              return false;
            }
          }

          async function firstHref(page, selector) {
            return await page.locator(selector).evaluateAll(nodes => {
              for (const node of nodes) {
                const href = node.href || node.getAttribute('href');
                if (href) return href;
              }
              return null;
            }).catch(() => null);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            for (let i = 1; i <= sessions; i++) {
              const viewport = viewports[(i - 1) % viewports.length];
              const context = await browser.newContext({
                viewport,
                locale: 'en-US',
                userAgent: 'Odyssey-QA-Playwright/1.0',
                extraHTTPHeaders: {
                  'X-Odyssey-QA': 'true',
                },
              });
              const page = await context.newPage();

              const sessionLog = {
                session: i,
                viewport,
                visits: [],
                errors: [],
                failedRequests: [],
              };

              page.on('pageerror', error => {
                sessionLog.errors.push({
                  type: 'pageerror',
                  message: String(error.message || error),
                });
              });

              page.on('console', msg => {
                if (msg.type() === 'error') {
                  sessionLog.errors.push({
                    type: 'console',
                    message: msg.text(),
                  });
                }
              });

              page.on('requestfailed', request => {
                const url = request.url();
                if (url.startsWith('http')) {
                  sessionLog.failedRequests.push({
                    url,
                    error: request.failure()?.errorText || 'request failed',
                  });
                }
              });

              const homeOk = await safeGoto(page, storeUrl, sessionLog, 'home');

              if (homeOk) {
                if (i === 1) {
                  await page.screenshot({
                    path: 'qa-results/home.png',
                    fullPage: true,
                  });
                }

                await sleep(900);

                const collectionHref = await firstHref(
                  page,
                  'a[href*="/collections/"]:not([href*="/collections/all"])'
                );

                if (collectionHref) {
                  const collectionOk = await safeGoto(
                    page,
                    collectionHref,
                    sessionLog,
                    'collection'
                  );

                  if (collectionOk) {
                    if (i === 1) {
                      await page.screenshot({
                        path: 'qa-results/collection.png',
                        fullPage: true,
                      });
                    }

                    await sleep(900);

                    const productHref = await firstHref(page, 'a[href*="/products/"]');
                    if (productHref) {
                      const productOk = await safeGoto(
                        page,
                        productHref,
                        sessionLog,
                        'product'
                      );

                      if (productOk && i === 1) {
                        await page.screenshot({
                          path: 'qa-results/product.png',
                          fullPage: true,
                        });
                      }
                    } else {
                      sessionLog.errors.push({
                        type: 'content',
                        message: 'No product link was found on the selected collection page.',
                      });
                    }
                  }
                } else {
                  sessionLog.errors.push({
                    type: 'content',
                    message: 'No collection link was found on the homepage.',
                  });
                }
              }

              report.sessions.push(sessionLog);
              await context.close();

              if (i < sessions) {
                await sleep(1200);
              }
            }

            await browser.close();

            report.finishedAt = new Date().toISOString();
            report.summary = {
              totalVisits: report.sessions.reduce((sum, s) => sum + s.visits.length, 0),
              totalErrors: report.sessions.reduce((sum, s) => sum + s.errors.length, 0),
              totalFailedRequests: report.sessions.reduce((sum, s) => sum + s.failedRequests.length, 0),
              sessionsWithErrors: report.sessions.filter(s => s.errors.length > 0).length,
            };

            fs.writeFileSync(
              'qa-results/report.json',
              JSON.stringify(report, null, 2)
            );

            const lines = [
              '# Shopify Playwright QA',
              '',
              `Store: ${report.storeUrl}`,
              `Sessions: ${report.executedSessions}`,
              `Page visits: ${report.summary.totalVisits}`,
              `Recorded errors: ${report.summary.totalErrors}`,
              `Failed requests: ${report.summary.totalFailedRequests}`,
              '',
              'QA traffic does not add UTM parameters to URLs.',
              'It remains identifiable by the dedicated User-Agent and X-Odyssey-QA request header.',
              '',
              'See the uploaded qa-results artifact for report.json and screenshots.',
            ];

            fs.writeFileSync('qa-results/summary.md', lines.join('\n'));

            if (report.sessions.every(s => s.visits.length === 0)) {
              process.exitCode = 1;
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          cat qa-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-playwright-qa-results
          path: .qa-playwright/qa-results/
          if-no-files-found: warn
          retention-days: 14
